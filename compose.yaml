services:
  frontend:
    build:
      context: .
      target: frontend-production
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    image: optica-manager-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-4444}:80"
    networks:
      - public

  api:
    build:
      context: .
      target: api-production
    image: optica-manager-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${API_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      internal:

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16

  internal:
    internal: true
