# Add this virtual host to the separate global Nginx container. That container
# must also join the external Docker network named by PROXY_NETWORK.
server {
    listen 80;
    server_name optica.internal.example;

    # Docker's embedded DNS lets Nginx resolve recreated service containers.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $optica_api optica-api:3000;
        proxy_pass http://$optica_api;
    }

    location / {
        set $optica_frontend optica-web:80;
        proxy_pass http://$optica_frontend;
    }
}
